{% extends 'base.html' %}

{% block title %}Connexion - APM{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box glass-card">

        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="
                width: 60px; height: 60px; border-radius: 50%;
                background: linear-gradient(135deg, #3b82f6, #10b981);
                display: flex; align-items: center; justify-content: center;
                margin: 0 auto 1rem;
                font-size: 1.6rem;
            ">🔐</div>
            <h2 style="font-size: 1.4rem;">APM Project</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.4rem;">
                Connectez-vous à votre espace
            </p>
        </div>

        {% if auth_error_message %}
        <div class="alert error" style="margin-bottom: 1.5rem;">
            ⚠ {{ auth_error_message }}
        </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Matricule ou Email</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-input"
                    placeholder="TOPNET_1  ou  votre@email.com"
                    autofocus
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="id_password">Mot de passe</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-input"
                    placeholder="••••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn" style="width: 100%; justify-content: center;">
                Se connecter
            </button>
        </form>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="{% url 'password_reset' %}" style="color: #93c5fd; font-size: 0.9rem; text-decoration: none;">
                Mot de passe oublié ?
            </a>
        </div>

    </div>
</div>

<style>
    .main-content { padding: 0 !important; }
</style>
{% endblock %}
