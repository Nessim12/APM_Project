{% extends 'base.html' %}

{% block title %}Mot de passe mis à jour - APM{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box glass-card" style="text-align: center;">
        <h2 style="font-size: 1.4rem; margin-bottom: 1rem;">Mot de passe mis à jour</h2>
        <p style="color: var(--text-muted); line-height: 1.6;">
            Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.
        </p>
        <a href="{% url 'login' %}" class="btn" style="margin-top: 1.5rem; justify-content: center;">
            Aller à la connexion
        </a>
    </div>
</div>

<style>
    .main-content { padding: 0 !important; }
</style>
{% endblock %}
