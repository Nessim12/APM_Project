{% extends 'base.html' %}

{% block title %}Email envoyé - APM{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box glass-card" style="text-align: center;">
        <h2 style="font-size: 1.4rem; margin-bottom: 1rem;">Vérifiez votre boîte mail</h2>
        <p style="color: var(--text-muted); line-height: 1.6;">
            Si un compte existe avec cette adresse email, un lien de réinitialisation a été envoyé.
        </p>
        <a href="{% url 'login' %}" class="btn" style="margin-top: 1.5rem; justify-content: center;">
            Retour à la connexion
        </a>
    </div>
</div>

<style>
    .main-content { padding: 0 !important; }
</style>
{% endblock %}
