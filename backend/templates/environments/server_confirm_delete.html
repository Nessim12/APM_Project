{% extends 'base.html' %}

{% block title %}Supprimer Serveur — APM{% endblock %}

{% block content %}
<div class="page-centered">
    <div class="header-row">
        <h1>Supprimer le serveur</h1>
        <a href="{% url 'server_list' %}" class="btn" style="background: transparent; border: 1px solid var(--border);">← Retour</a>
    </div>

    <div class="glass-card">
        <p>Voulez-vous vraiment supprimer le serveur <strong>{{ server.hostname }}</strong> ?</p>

        <form method="post" style="display: flex; gap: 1rem; flex-wrap: wrap;">
            {% csrf_token %}
            <button type="submit" class="btn danger">Supprimer</button>
            <a href="{% url 'server_list' %}" class="btn" style="background: transparent; border: 1px solid var(--border);">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
